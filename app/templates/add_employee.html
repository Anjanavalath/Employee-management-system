{% extends "base.html" %} 
{% block content %}

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white py-3">
          <h4 class="card-title mb-0 fw-semibold">Add New Employee</h4>
        </div>

        <div class="card-body p-4">
          <form action="/employee/add" method="POST">
            {# Add your framework's CSRF token here if required, e.g., {% csrf_token %} #}

            <!-- Name Field -->
            <div class="mb-3">
              <label for="name" class="form-label fw-medium text-secondary">Full Name</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
              <label for="email" class="form-label fw-medium text-secondary">Email Address</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="alex@company.com" required>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <label for="password" class="form-label fw-medium text-secondary">Temporary Password</label>
              <input type="password" id="password" name="password" class="form-control" required>
              <div class="form-text">Must be at least 8 characters.</div>
            </div>

            <!-- Row for Salary & Department -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="salary" class="form-label fw-medium text-secondary">Salary</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" id="salary" name="salary" class="form-control" min="0" step="0.01" placeholder="0.00" required>
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="department" class="form-label fw-medium text-secondary">Department</label>
                <input type="text" id="department" name="department" class="form-control" placeholder="e.g. Engineering" required>
              </div>
            </div>

            <hr class="my-4 text-muted">

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end gap-2">
              <button type="reset" class="btn btn-outline-secondary px-4">Reset</button>
              <button type="submit" class="btn btn-success px-4">Save Employee</button>
            </div>
            
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
