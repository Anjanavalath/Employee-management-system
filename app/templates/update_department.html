{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Update Department</h2>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Department Name
            </label>

            <input
                type="text"
                name="department_name"
                class="form-control"
                value="{{ department.department_name }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Location
            </label>

            <input
                type="text"
                name="location"
                class="form-control"
                value="{{ department.location }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Head of Department
            </label>

            <input
                type="text"
                name="head_of_department"
                class="form-control"
                value="{{ department.head_of_department }}"
                required>

        </div>

        <button class="btn btn-warning">

            Update Department

        </button>

        <a href="{{ url_for('department.departmentList') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
