<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<!-- h-100 and d-flex flex-column make the sticky footer work flawlessly -->
<body class="d-flex flex-column h-100 bg-light">

    <!-- Header Navigation -->
    {% include "navbar.html" %}
    
    <!-- Main Content Container (flex-grow-1 pushes the footer down) -->
    <main class="flex-shrink-0 my-5">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Enhanced Footer -->
    <footer class="footer mt-auto py-3 bg-dark text-light border-top border-secondary">
        <div class="container text-center">
            <div class="row align-items-center">
                <div class="col-md-6 text-md-start mb-2 mb-md-0">
                    <span class="small text-muted">&copy; 2026 <span class="text-white fw-medium">EMS</span>. All rights reserved.</span>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="small text-muted">Built with <i class="bi bi-heart-fill text-danger mx-1"></i> for secure operations.</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
